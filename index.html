<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card, .admin-panel {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }
        .google-btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
        }
        .google-btn:hover {
            background-color: #357ae8;
        }
        .logout-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        .hidden {
            display: none;
        }
    }
    </style>
</head>
<body>

    <!-- Paparan Log Masuk -->
    <div id="loginSection" class="login-card">
        <h2>Admin Dashboard</h2>
        <p>Sila log masuk menggunakan akaun Google anda untuk meneruskan.</p>
        <button id="loginBtn" class="google-btn">Log Masuk dengan Google</button>
    </div>

    <!-- Paparan Panel Admin (Selepas Berjaya Log Masuk) -->
    <div id="adminSection" class="admin-panel hidden">
        <h2>Selamat Datang, Admin!</h2>
        <p id="userEmail"></p>
        <p>Ini adalah kawasan eksklusif pentadbir.</p>
        <button id="logoutBtn" class="logout-btn">Log Keluar</button>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase anda
        const firebaseConfig = {
            apiKey: "AIzaSyCxxEsifGhdkTj_3EOdjflPS__B_SKRSZY",
            authDomain: "admin-f72e5.firebaseapp.com",
            projectId: "admin-f72e5",
            storageBucket: "admin-f72e5.firebasestorage.app",
            messagingSenderId: "523370880023",
            appId: "1:523370880023:web:883b422a9611abb2889052"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userEmail = document.getElementById('userEmail');

        // Fungsi Log Masuk Google
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    // Berjaya log masuk
                    console.log("Log masuk berjaya:", result.user.email);
                })
                .catch((error) => {
                    console.error("Ralat log masuk:", error.message);
                    alert("Gagal log masuk: " + error.message);
                });
        });

        // Fungsi Log Keluar
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                console.log("Log keluar berjaya");
            }).catch((error) => {
                console.error("Ralat log keluar:", error);
            });
        });

        // Semak Status Authentication secara langsung
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Pengguna sudah log masuk
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                userEmail.textContent = `Emel: ${user.email}`;
                
                // TIPS: Jika anda ingin mengehadkan siapa sahaja admin yang boleh masuk,
                // anda boleh buat semakan emel di sini. Cth: if (user.email !== 'admin@email.com') { signOut(auth); alert("Bukan admin!"); }
            } else {
                // Pengguna belum log masuk
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
