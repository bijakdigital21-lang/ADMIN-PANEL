<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bijak Belajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("fn_2mv2164kWUf8J7"); // Public Key anda
       })();
    </script>

  <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config Anda[cite: 1]
        const firebaseConfig = {
            apiKey: "AIzaSyDXc06B8WLtqjkG0aScBHrd3L3M-n_5okc",
            authDomain: "grammar-hub-6af80.firebaseapp.com",
            databaseURL: "https://grammar-hub-6af80-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "grammar-hub-6af80",
            storageBucket: "grammar-hub-6af80.firebasestorage.app",
            messagingSenderId: "1092171234032",
            appId: "1:1092171234032:web:7cc8efefb812993500e035"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Auto muat data secara live apabila halaman dibuka
        window.addEventListener('DOMContentLoaded', () => {
            initLiveListeners();
        });

        // Fungsi Refresh Manual (Kini hanya paparkan status kerana data sudah live)
        window.refreshData = function() {
            alert("Data sentiasa dikemaskini secara live!");
        }

        // Tukar Tab Admin (Pending vs Approved)
        window.switchTab = function(tabName) {
            const pendingSec = document.getElementById('section_pending');
            const approvedSec = document.getElementById('section_approved');
            const tabPendingBtn = document.getElementById('tab_pending_btn');
            const tabApprovedBtn = document.getElementById('tab_approved_btn');

            if (tabName === 'pending') {
                pendingSec.classList.remove('hidden');
                approvedSec.classList.add('hidden');
                tabPendingBtn.className = "px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white shadow";
                tabApprovedBtn.className = "px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
            } else {
                pendingSec.classList.add('hidden');
                approvedSec.classList.remove('hidden');
                tabApprovedBtn.className = "px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white shadow";
                tabPendingBtn.className = "px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
            }
        }

        // Fungsi Live Listeners Firebase Realtime Database
        function initLiveListeners() {
            // Listener untuk Pending Users
            const pendingRef = ref(db, 'pending_users');
            onValue(pendingRef, (snapshot) => {
                const data = snapshot.val();
                loadPendingTable(data);
            });

            // Listener untuk Approved Users
            const approvedRef = ref(db, 'approved_users');
            onValue(approvedRef, (snapshot) => {
                const data = snapshot.val();
                loadApprovedTable(data);
            });
        }

        // 3. Papar Senarai Pending di Dashboard Admin secara Live
        function loadPendingTable(data) {
            const tbody = document.getElementById('pending_table_body');
            tbody.innerHTML = '';

            if (!data) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-500">Tiada senarai menunggu.</td></tr>`;
                return;
            }

            Object.keys(data).forEach((key) => {
                const user = data[key];
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100";
                tr.innerHTML = `
                    <td class="py-3 px-4">
                        <span class="font-semibold text-slate-800">${user.nama}</span><br>
                        <span class="text-xs text-slate-500">${user.email} (${user.nofon})</span>
                    </td>
                    <td class="py-3 px-4">
                        <span class="font-medium text-blue-600">${user.reseller_nama || '-'}</span><br>
                        <span class="text-xs text-slate-400">${user.reseller_email || ''}</span>
                    </td>
                    <td class="py-3 px-4 text-xs text-slate-500">${user.date}</td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="approveUser('${key}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg shadow">Approve</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. Papar Senarai Telah Diluluskan (Approved) secara Live
        function loadApprovedTable(data) {
            const tbody = document.getElementById('approved_table_body');
            tbody.innerHTML = '';

            if (!data) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-500">Tiada rekod yang telah diluluskan.</td></tr>`;
                return;
            }

            Object.keys(data).reverse().forEach((key) => {
                const user = data[key];
                const rawMsg = `🎉 TERIMA KASIH ATAS PEMBELIAN ANDA!

Terima kasih kerana memilih Grammar Hub! 💙

Kami sangat teruja untuk anda mula belajar, berlatih dan meneroka pelbagai bahan pembelajaran yang telah disediakan untuk membantu meningkatkan penguasaan English Grammar dengan lebih mudah dan menyeronokkan.

📚 AKSES GRAMMAR HUB ANDA

Klik pautan di bawah untuk mula menggunakan Grammar Hub:

👇🏻👇🏻
https://bijakdigital21-lang.github.io/Grammarhub./

🔐 MAKLUMAT LOG MASUK

Email: ${user.email}
Password: ${user.password}

📌 Sila tukar password anda di laman profile selepas berjaya log masuk ke aplikasi ini.

⚠️ PENTING

📌 Simpan pautan Grammar Hub ini untuk rujukan dan akses anda pada masa akan datang.

Sertai group reseller kami untuk info dan sokongan berterusan.
👇🏻👇🏻👇🏻
https://t.me/+Z-uxVSN8A54zNTdl

📱 Sekiranya anda mengalami sebarang masalah untuk membuka atau mengakses Grammar Hub, jangan risau.

Hubungi kami melalui WhatsApp dan kami sedia membantu.

💙 Selamat belajar!
Semoga Grammar Hub membantu anda.`;

                let cleanPhone = user.nofon ? user.nofon.replace(/\D/g,'') : '';
                if(cleanPhone.startsWith('0')) {
                    cleanPhone = '6' + cleanPhone;
                }

                const encodedMsg = encodeURIComponent(rawMsg);
                const waLink = `https://wa.me/${cleanPhone}?text=${encodedMsg}`;

                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100";
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-slate-800">
                        ${user.nama}<br><span class="text-xs text-slate-400">${user.email}</span>
                    </td>
                    <td class="py-3 px-4">
                        <span class="font-medium text-blue-600">${user.reseller_nama || '-'}</span>
                    </td>
                    <td class="py-3 px-4">
                        <a href="${waLink}" target="_blank" class="inline-flex items-center gap-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-md border border-emerald-200 transition" title="Klik untuk hantar WhatsApp">
                            📱 ${user.nofon} ↗
                        </a>
                    </td>
                    <td class="py-3 px-4 text-xs text-slate-500">${user.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 5. Proses Approve (Firebase Auth + Realtime DB + EmailJS + Pindah Node)
        window.approveUser = async function(firebaseKey) {
            try {
                // Ambil data user spesifik dari Firebase berdasarkan key uniknya
                const userRef = ref(db, 'pending_users/' + firebaseKey);
                const snapshot = await get(userRef);
                
                if (!snapshot.exists()) {
                    alert("Data pengguna tidak dijumpai!");
                    return;
                }

                const user = snapshot.val();

                if (!confirm(`Adakah anda pasti untuk approve ${user.nama}?`)) return;

                // 1. Cipta akaun dalam Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, user.email, user.password);
                const firebaseUser = userCredential.user;

                // 2. Simpan profil lengkap ke dalam nod 'users'
                await set(ref(db, 'users/' + firebaseUser.uid), {
                    nama: user.nama,
                    email: user.email,
                    nofon: user.nofon,
                    reseller_nama: user.reseller_nama || '',
                    reseller_email: user.reseller_email || '',
                    reseller_nofon: user.reseller_nofon || '',
                    createdAt: new Date().toISOString()
                });

                // 3. Hantar emel menggunakan EmailJS
                const templateParams = {
                    to_name: user.nama,
                    to_email: user.email,
                    password: user.password
                };
                await emailjs.send('service_hd5rpgc', 'template_9sh4gw2', templateParams);

                // 4. Masukkan ke dalam nod 'approved_users' di Firebase
                await set(push(ref(db, 'approved_users')), user);

                // 5. Padam dari nod 'pending_users' di Firebase
                await remove(userRef);

                alert(`Berjaya approve ${user.nama}! Akaun dicipta dan emel telah dihantar.`);

            } catch (error) {
                console.error("Ralat:", error);
                alert("Gagal memproses kelulusan: " + error.message);
            }
        }
    </script>
</head>
<body class="min-h-screen bg-slate-100 py-10 px-4 flex flex-col items-center">

    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <div class="bg-slate-900 text-white px-8 py-5 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-xl tracking-tight">GRAMMAR HUB</h3>
                <p class="text-xs text-slate-400 mt-0.5">Admin Control Panel (Live Realtime)</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-semibold px-3 py-1 rounded-full animate-pulse">
                    ● Live Connected
                </span>
            </div>
        </div>

        <div class="p-8">
            <div id="admin_dashboard" class="space-y-6">
                <div class="flex gap-2 border-b pb-4">
                    <button id="tab_pending_btn" onclick="switchTab('pending')" class="px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white shadow">
                        Menunggu Kelulusan (Pending)
                    </button>
                    <button id="tab_approved_btn" onclick="switchTab('approved')" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">
                        Telah Diluluskan (Approved)
                    </button>
                </div>

                <div id="section_pending" class="space-y-3">
                    <h4 class="font-semibold text-slate-800 text-sm">Senarai Pendaftaran Baru (Customer & Reseller)</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                                    <th class="py-3 px-4">Maklumat Customer</th>
                                    <th class="py-3 px-4">Nama Reseller</th>
                                    <th class="py-3 px-4">Tarikh Mohon</th>
                                    <th class="py-3 px-4 text-right">Tindakan</th>
                                </tr>
                            </thead>
                            <tbody id="pending_table_body">
                                <!-- Data akan masuk secara live di sini -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="section_approved" class="space-y-3 hidden">
                    <h4 class="font-semibold text-slate-800 text-sm">Rekod Pelanggan & Reseller Diluluskan</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                                    <th class="py-3 px-4">Customer</th>
                                    <th class="py-3 px-4">Reseller Bertanggungjawab</th>
                                    <th class="py-3 px-4">WhatsApp Customer</th>
                                    <th class="py-3 px-4">Tarikh</th>
                                </tr>
                            </thead>
                            <tbody id="approved_table_body">
                                <!-- Data akan masuk secara live di sini -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
