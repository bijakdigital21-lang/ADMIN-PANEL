<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
        .error-msg { color: red; font-size: 14px; margin-top: 10px; text-align: center; }
        #dashboard { display: none; }
    </style>
</head>
<body>

    <!-- Bahagian Borang Log Masuk -->
    <div class="login-card" id="login-section">
        <h2>Admin Login</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Log Masuk</button>
            <div class="error-msg" id="error-msg"></div>
        </form>
    </div>

    <!-- Bahagian Dashboard Admin (Terlindung) -->
    <div id="dashboard" style="padding: 20px; text-align: center;">
        <h1>Selamat Datang ke Dashboard Admin!</h1>
        <p>Anda telah berjaya log masuk.</p>
        <button id="logout-btn" style="background-color: #f44336; width: auto; padding: 10px 20px;">Log Keluar</button>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase anda
        const firebaseConfig = {
            apiKey: "AIzaSyCxxEsifGhdkTj_3EOdjflPS__B_SKRSZY",
            authDomain: "admin-f72e5.firebaseapp.com",
            projectId: "admin-f72e5",
            storageBucket: "admin-f72e5.firebasestorage.app",
            messagingSenderId: "523370880023",
            appId: "1:523370880023:web:883b422a9611abb2889052"
        };

        // Mulakan Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboard = document.getElementById('dashboard');
        const errorMsg = document.getElementById('error-msg');
        const logoutBtn = document.getElementById('logout-btn');

        // Semak status log masuk pengguna secara automatik
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Pengguna sudah log masuk, paparkan dashboard
                loginSection.style.display = 'none';
                dashboard.style.display = 'block';
            } else {
                // Pengguna belum log masuk, paparkan borang log masuk
                loginSection.style.display = 'block';
                dashboard.style.display = 'none';
            }
        });

        // Proses Log Masuk
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorMsg.textContent = '';
            } catch (error) {
                errorMsg.textContent = 'Gagal log masuk: Email atau password salah.';
                console.error(error.code, error.message);
            }
        });

        // Proses Log Keluar
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error('Gagal log keluar', error);
            }
        });
    </script>
</body>
</html>
